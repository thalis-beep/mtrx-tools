<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      :root {
        --bg: #f4efe6;
        --ink: #22262c;
        --ink-soft: #5c6470;
        --blue: #4a6b8a;
        --blue-soft: #dbe4ec;
        --white: #ffffff;
        --accent: #e0532a;
        --rule: #d9d2c5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: Montserrat, sans-serif;
        color: var(--ink);
      }
      .abs {
        position: absolute;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      /* persistent morphing shape: paper -> panel -> timeline track -> lab dish */
      #morph {
        position: absolute;
        left: 0;
        top: 0;
        width: 540px;
        height: 300px;
        border-radius: 18px;
        background: var(--white);
        box-shadow: 0 18px 40px rgba(34, 38, 44, 0.08);
      }

      #header {
        left: 90px;
        top: 62px;
        width: 900px;
        display: flex;
        justify-content: space-between;
        font-size: 20px;
        color: var(--ink-soft);
        opacity: 0;
      }
      #steps {
        position: relative;
        width: 220px;
        height: 24px;
      }
      .step {
        position: absolute;
        right: 0;
        top: 0;
        white-space: nowrap;
      }
      #header b {
        color: var(--ink);
        font-weight: 700;
      }

      /* ---------- Scene A: the study ---------- */
      #year {
        left: 270px;
        top: 440px;
        width: 540px;
        text-align: center;
        font-weight: 900;
        font-size: 170px;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--ink);
      }
      #doc-label {
        left: 330px;
        top: 236px;
        font-size: 20px;
        color: var(--blue);
      }
      #doc-rule {
        left: 330px;
        top: 432px;
        width: 420px;
        height: 3px;
        background: var(--ink);
        transform-origin: left center;
      }
      #doc-name {
        left: 330px;
        top: 462px;
        width: 420px;
        font-size: 40px;
        font-weight: 700;
        line-height: 1.1;
        white-space: nowrap;
      }
      #doc-role {
        left: 330px;
        top: 528px;
        font-size: 18px;
        color: var(--ink-soft);
      }
      .doc-line {
        left: 330px;
        height: 12px;
        border-radius: 6px;
        background: var(--blue-soft);
        transform-origin: left center;
      }

      /* ---------- Scene B: participants ---------- */
      #grid {
        left: 90px;
        top: 150px;
        width: 900px;
        height: 560px;
      }
      .man {
        position: absolute;
        width: 84px;
        height: 185px;
      }
      .man svg,
      #hero svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .man .fill {
        fill: var(--ink);
      }
      #counter-men {
        left: 90px;
        top: 760px;
        width: 900px;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 22px;
      }
      #men-num {
        font-size: 150px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--ink);
        width: 190px;
        text-align: right;
      }
      #men-word {
        font-size: 72px;
        font-weight: 900;
        color: var(--blue);
        letter-spacing: 0.02em;
      }
      #men-tag {
        left: 90px;
        top: 735px;
        width: 900px;
        text-align: center;
        font-size: 20px;
        color: var(--ink-soft);
      }
      #hero {
        left: 420px;
        top: 190px;
        width: 200px;
        height: 440px;
      }
      #hero .fill {
        fill: var(--blue);
      }
      #sling {
        fill: none;
        stroke: var(--accent);
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #ring {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
      }
      #callout-line {
        left: 590px;
        top: 452px;
        width: 90px;
        height: 3px;
        background: var(--accent);
        transform-origin: left center;
      }
      #callout {
        left: 694px;
        top: 422px;
        width: 296px;
        font-size: 28px;
        font-weight: 900;
        line-height: 1.08;
        color: var(--ink);
      }
      #callout span {
        color: var(--accent);
      }
      #callout-sub {
        left: 694px;
        top: 496px;
        font-size: 16px;
        color: var(--ink-soft);
      }

      /* ---------- Scene C: time ---------- */
      #days-label {
        left: 90px;
        top: 168px;
        width: 900px;
        text-align: center;
        font-size: 22px;
        color: var(--blue);
      }
      #days {
        left: 90px;
        top: 205px;
        width: 900px;
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: 22px;
      }
      #days-num {
        font-size: 190px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.04em;
        width: 380px;
        text-align: right;
      }
      #days-word {
        font-size: 80px;
        font-weight: 900;
        color: var(--blue);
      }
      #fill {
        left: 150px;
        top: 516px;
        width: 780px;
        height: 8px;
        border-radius: 4px;
        background: var(--blue);
        transform-origin: left center;
      }
      #knob {
        left: 136px;
        top: 506px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 7px rgba(224, 83, 42, 0.18);
      }
      #cal {
        left: 116px;
        top: 410px;
        width: 68px;
        height: 72px;
        perspective: 300px;
      }
      .cal-body {
        position: absolute;
        inset: 0;
        border-radius: 10px;
        background: var(--white);
        border: 3px solid var(--ink);
      }
      .cal-top {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 20px;
        border-radius: 10px 10px 0 0;
        background: var(--ink);
      }
      .cal-page {
        position: absolute;
        left: 8px;
        top: 26px;
        width: 52px;
        height: 36px;
        border-radius: 4px;
        background: var(--blue-soft);
        transform-origin: center top;
      }
      .tick {
        top: 548px;
        width: 2px;
        height: 14px;
        background: var(--rule);
      }
      .tick-label {
        top: 574px;
        font-size: 18px;
        color: var(--ink-soft);
      }

      /* ---------- Scene D: the finding ---------- */
      .cell {
        width: 46px;
        height: 22px;
      }
      .cell svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .cell .h {
        fill: var(--blue);
      }
      .cell .t {
        fill: none;
        stroke: var(--blue);
        stroke-width: 3;
        stroke-linecap: round;
      }
      #lab-label {
        left: 590px;
        top: 244px;
        width: 400px;
        font-size: 19px;
        line-height: 1.5;
        color: var(--ink-soft);
      }
      #lab-num {
        left: 590px;
        top: 300px;
        width: 400px;
        font-size: 230px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.05em;
        color: var(--ink);
      }
      #headline {
        left: 90px;
        top: 680px;
        width: 900px;
        text-align: center;
        font-size: 84px;
        font-weight: 900;
        letter-spacing: -0.02em;
        white-space: nowrap;
        line-height: 1;
      }
      #headline .w {
        display: inline-block;
      }
      #hl-zero {
        color: var(--accent);
      }
      #hl-rule {
        left: 390px;
        top: 800px;
        width: 300px;
        height: 4px;
        border-radius: 2px;
        background: var(--accent);
        transform-origin: center center;
      }
      #subline {
        left: 90px;
        top: 832px;
        width: 900px;
        text-align: center;
        font-size: 32px;
        font-weight: 700;
        color: var(--ink);
      }
      #subline span {
        font-weight: 400;
        color: var(--ink-soft);
      }
      #progress {
        left: 90px;
        top: 984px;
        width: 900px;
        height: 4px;
        border-radius: 2px;
        background: var(--rule);
        overflow: hidden;
      }
      #progress-fill {
        width: 100%;
        height: 100%;
        background: var(--ink);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1080"
    >
      <div id="morph"></div>

      <div id="header" class="abs mono"><span><b>Shafik</b> study · 1992</span><span id="steps"><span class="step" id="step-1">Participants</span><span class="step" id="step-2">Duration</span><span class="step" id="step-3">Finding</span></span></div>

      <!-- Scene A -->
      <div id="doc-label" class="abs mono">Research study</div>
      <div id="year" class="abs">1992</div>
      <div id="doc-rule" class="abs"></div>
      <div id="doc-name" class="abs">Dr. Ahmed Shafik</div>
      <div id="doc-role" class="abs mono">Lead researcher</div>
      <div class="abs doc-line" style="top: 600px; width: 420px"></div>
      <div class="abs doc-line" style="top: 632px; width: 380px"></div>
      <div class="abs doc-line" style="top: 664px; width: 410px"></div>
      <div class="abs doc-line" style="top: 696px; width: 300px"></div>
      <div class="abs doc-line" style="top: 760px; width: 400px"></div>
      <div class="abs doc-line" style="top: 792px; width: 250px"></div>

      <!-- Scene B -->
      <div id="grid" class="abs"></div>
      <div id="hero" class="abs">
        <svg viewBox="0 0 100 220">
          <g class="fill">
            <circle cx="50" cy="26" r="21" />
            <rect x="19" y="54" width="62" height="82" rx="24" />
            <rect x="3" y="60" width="15" height="72" rx="7.5" />
            <rect x="82" y="60" width="15" height="72" rx="7.5" />
            <rect x="23" y="112" width="24" height="104" rx="12" />
            <rect x="53" y="112" width="24" height="104" rx="12" />
          </g>
          <ellipse id="ring" cx="50" cy="122" rx="40" ry="22" />
          <path id="sling" d="M22 100 L32 118 Q50 136 68 118 L78 100" />
        </svg>
      </div>
      <div id="callout-line" class="abs"></div>
      <div id="callout" class="abs">Tight<br /><span>polyester</span> sling</div>
      <div id="callout-sub" class="abs mono">Simplified diagram</div>
      <div id="men-tag" class="abs mono">Healthy volunteers</div>
      <div id="counter-men" class="abs"><span id="men-num">1</span><span id="men-word">MEN</span></div>

      <!-- Scene C -->
      <div id="days-label" class="abs mono">Average time</div>
      <div id="days" class="abs"><span id="days-num">0</span><span id="days-word">DAYS</span></div>
      <div id="fill" class="abs"></div>
      <div id="cal" class="abs">
        <div class="cal-body"></div>
        <div class="cal-top"></div>
        <div class="cal-page" id="page-a"></div>
        <div class="cal-page" id="page-b"></div>
      </div>
      <div id="knob" class="abs"></div>
      <div id="ticks"></div>

      <!-- Scene D -->
      <div id="cells"></div>
      <div id="lab-label" class="abs mono">Participants with<br />sperm detected</div>
      <div id="lab-num" class="abs">14</div>
      <div id="headline" class="abs"><span class="w" id="hl-zero">ZERO</span> <span class="w" id="hl-2">SPERM</span> <span class="w" id="hl-3">COUNT</span></div>
      <div id="hl-rule" class="abs"></div>
      <div id="subline" class="abs">All 14 participants <span>— reported study result</span></div>

      <div id="progress" class="abs"><div id="progress-fill"></div></div>

      <audio id="narration" src="assets/narration.wav" data-start="0.1" data-track-index="1" data-volume="1"></audio>
      <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="10" data-track-index="2" data-volume="0.55"></audio>
    </div>

    <script>
      const MAN_SVG =
        '<svg viewBox="0 0 100 220"><g class="fill"><circle cx="50" cy="26" r="21"/><rect x="19" y="54" width="62" height="82" rx="24"/><rect x="3" y="60" width="15" height="72" rx="7.5"/><rect x="82" y="60" width="15" height="72" rx="7.5"/><rect x="23" y="112" width="24" height="104" rx="12"/><rect x="53" y="112" width="24" height="104" rx="12"/></g></svg>';
      const CELL_SVG =
        '<svg viewBox="0 0 46 22"><path class="t" d="M16 11 C22 4 28 18 34 11 S42 6 45 10"/><ellipse class="h" cx="9" cy="11" rx="8" ry="6"/></svg>';

      // 14 participants: 7 x 2 grid inside the panel (panel: left 90, top 150, 900 x 560)
      const grid = document.getElementById("grid");
      const men = [];
      for (let i = 0; i < 14; i++) {
        const col = i % 7;
        const row = Math.floor(i / 7);
        const el = document.createElement("div");
        el.className = "man";
        el.id = "man-" + i;
        el.style.left = 66 + col * 116 + "px";
        el.style.top = 60 + row * 235 + "px";
        el.innerHTML = MAN_SVG;
        grid.appendChild(el);
        men.push(el);
      }
      const HERO_INDEX = 3; // centre of the top row

      // timeline ticks
      const ticks = document.getElementById("ticks");
      const tickEls = [];
      const tickDays = [0, 20, 40, 60, 80, 100, 120, 140];
      tickDays.forEach((d, i) => {
        const x = 150 + (780 * d) / 140;
        const t = document.createElement("div");
        t.className = "abs tick";
        t.style.left = x - 1 + "px";
        ticks.appendChild(t);
        tickEls.push(t);
      });
      const tickLabels = [];
      [
        [0, "Day 0"],
        [140, "Day 140"],
      ].forEach(([d, txt], i) => {
        const l = document.createElement("div");
        l.className = "abs tick-label mono";
        l.textContent = txt;
        l.style.left = (i === 0 ? 150 : 930 - 120) + "px";
        if (i === 1) {
          l.style.width = "120px";
          l.style.textAlign = "right";
        }
        ticks.appendChild(l);
        tickLabels.push(l);
      });

      // illustrated sperm-cell icons inside the dish (dish: centre 330,430, r 190)
      const cellsHost = document.getElementById("cells");
      const cellPos = [
        [270, 330, -20], [350, 318, 15], [412, 372, 160], [228, 400, 30],
        [322, 402, -10], [420, 452, 190], [262, 472, 10], [350, 484, -25],
        [436, 522, 200], [300, 540, 25], [384, 556, -170], [212, 482, 40],
        [458, 420, 175], [330, 584, -15],
      ];
      const cells = cellPos.map(([x, y, r], i) => {
        const c = document.createElement("div");
        c.className = "abs cell";
        c.id = "cell-" + i;
        c.style.left = x - 23 + "px";
        c.style.top = y - 11 + "px";
        c.innerHTML = CELL_SVG;
        cellsHost.appendChild(c);
        return { el: c, rot: r };
      });

      const tl = gsap.timeline({ paused: true });
      const morph = "#morph";

      // ---------- initial states ----------
      gsap.set(morph, { x: 270, y: 1120 });
      gsap.set(["#doc-label", "#doc-rule", "#doc-name", "#doc-role", ".doc-line"], { opacity: 0 });
      gsap.set(men, { opacity: 0 });
      gsap.set(
        ["#hero", "#callout-line", "#callout", "#callout-sub", "#counter-men", "#men-tag"],
        { opacity: 0 }
      );
      gsap.set(["#days-label", "#days", "#fill", "#knob", "#cal", tickEls, tickLabels], { opacity: 0 });
      gsap.set(cells.map((c) => c.el), { opacity: 0 });
      gsap.set(["#lab-label", "#lab-num", "#headline", "#hl-rule", "#subline"], { opacity: 0 });
      gsap.set("#progress", { opacity: 0 });
      gsap.set(["#step-2", "#step-3"], { opacity: 0 });

      // ---------- 0.0 - 2.8  ESTABLISH THE STUDY ----------
      // folded paper slides up into the centre
      tl.fromTo(morph, { x: 270, y: 1120 }, { x: 270, y: 390, duration: 0.7, ease: "power3.out" }, 0.05);
      // "1992" lands with the narration
      tl.fromTo(
        "#year",
        { y: 40, opacity: 0, scale: 0.86 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" },
        0.82
      );
      // paper unfolds into a document
      tl.to(morph, { y: 180, height: 720, duration: 0.6, ease: "power3.inOut" }, 1.5);
      tl.to(
        "#year",
        { y: -165, x: 26, scale: 0.62, duration: 0.6, ease: "power3.inOut", transformOrigin: "0% 50%" },
        1.5
      );
      tl.fromTo("#doc-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.75);
      tl.fromTo("#doc-rule", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "power3.out" }, 1.85);
      tl.fromTo("#doc-name", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.95);
      tl.fromTo("#doc-role", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 2.15);
      tl.fromTo(
        ".doc-line",
        { opacity: 1, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out", stagger: 0.05 },
        2.05
      );

      // ---------- 2.8 - 5.3  PARTICIPANTS ----------
      tl.to(
        ["#year", "#doc-label", "#doc-rule", "#doc-name", "#doc-role", ".doc-line"],
        { opacity: 0, y: "-=14", duration: 0.22, ease: "power2.in" },
        2.66
      );
      // document morphs into the participant panel
      tl.to(
        morph,
        { x: 90, y: 150, width: 900, height: 560, borderRadius: 28, duration: 0.45, ease: "power3.inOut" },
        2.7
      );
      tl.fromTo("#header", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.9);
      tl.fromTo("#progress", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.9);
      tl.fromTo(
        men,
        { opacity: 0, y: 28, scale: 0.7, transformOrigin: "50% 100%" },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.04 },
        3.08
      );
      tl.fromTo("#counter-men", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.05);
      const menCount = { v: 1 };
      tl.to(
        menCount,
        {
          v: 14,
          duration: 0.56,
          ease: "none",
          onUpdate: () => (document.getElementById("men-num").textContent = Math.round(menCount.v)),
        },
        3.1
      );
      tl.fromTo("#men-num", { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, transformOrigin: "100% 80%" }, 3.6);
      tl.fromTo("#men-tag", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 3.45);

      // highlight the central participant
      tl.to(
        men.filter((_, i) => i !== HERO_INDEX),
        { opacity: 0.12, duration: 0.35, ease: "power2.out" },
        3.85
      );
      tl.to("#man-" + HERO_INDEX + " .fill", { fill: "#4a6b8a", duration: 0.3 }, 3.85);
      // hero grows out of its grid slot into the diagram
      const slotLeft = 90 + 66 + HERO_INDEX * 116; // 504
      const slotTop = 150 + 60; // 210
      const heroScale = 84 / 200;
      tl.fromTo(
        "#hero",
        { opacity: 0, x: slotLeft - 420 - (200 - 84) / 2, y: slotTop - 190 - (440 - 185) / 2, scale: heroScale },
        { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.55, ease: "power3.inOut" },
        4.0
      );
      tl.to(men, { opacity: 0, duration: 0.25 }, 4.05);
      tl.fromTo("#sling", { strokeDasharray: 120, strokeDashoffset: 120 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 4.35);
      tl.fromTo("#ring", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 4.5);
      tl.fromTo("#callout-line", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out" }, 4.55);
      tl.fromTo("#callout", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 4.65);
      tl.fromTo("#callout-sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.8);

      // ---------- 5.3 - 7.4  PASSAGE OF TIME ----------
      tl.to(["#callout-line", "#callout", "#callout-sub", "#ring", "#counter-men", "#men-tag"], { opacity: 0, duration: 0.25 }, 5.2);
      // the participant contracts into the timeline's start point
      tl.to("#hero", { x: 150 - 420 - 100, y: 520 - 190 - 220, scale: 0.06, opacity: 0, duration: 0.5, ease: "power3.in" }, 5.25);
      // panel collapses into the timeline track
      tl.to(
        morph,
        {
          x: 150,
          y: 516,
          width: 780,
          height: 8,
          borderRadius: 4,
          backgroundColor: "#dbe4ec",
          boxShadow: "0 0 0 rgba(0,0,0,0)",
          duration: 0.55,
          ease: "power3.inOut",
        },
        5.3
      );
      tl.to("#step-1", { opacity: 0, y: -10, duration: 0.25 }, 5.3);
      tl.fromTo("#step-2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 5.4);
      tl.fromTo("#knob", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 5.6);
      tl.fromTo("#cal", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 5.62);
      tl.to(tickEls, { opacity: 1, duration: 0.25, stagger: 0.04 }, 5.6);
      tl.to(tickLabels, { opacity: 1, duration: 0.3 }, 5.7);
      tl.fromTo("#days-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35 }, 5.55);
      tl.fromTo("#days", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 5.6);
      // indicator travels across with flowing fill, counter climbs to 140
      const travel = { p: 0 };
      tl.fromTo("#fill", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 0, duration: 0.01 }, 5.72);
      tl.to(
        travel,
        {
          p: 1,
          duration: 1.42,
          ease: "power2.inOut",
          onUpdate: () => {
            const p = travel.p;
            gsap.set("#fill", { scaleX: p });
            gsap.set(["#knob", "#cal"], { x: 780 * p });
            document.getElementById("days-num").textContent = Math.round(140 * p);
          },
        },
        5.75
      );
      // calendar pages flip as days pass
      for (let k = 0; k < 6; k++) {
        tl.fromTo(
          k % 2 ? "#page-b" : "#page-a",
          { rotationX: 0, opacity: 1 },
          { rotationX: -90, opacity: 0.2, duration: 0.2, ease: "power1.in", immediateRender: false },
          5.85 + k * 0.22
        );
        tl.set(k % 2 ? "#page-b" : "#page-a", { rotationX: 0, opacity: 1 }, 5.85 + k * 0.22 + 0.21);
      }
      tl.to("#days-num", { color: "#e0532a", duration: 0.2 }, 7.12);
      tl.fromTo("#days", { scale: 1 }, { scale: 1.05, duration: 0.14, yoyo: true, repeat: 1, transformOrigin: "50% 80%" }, 7.15);

      // ---------- 7.4 - 10  THE KEY FINDING ----------
      tl.to(["#days-label", "#days", "#cal", tickEls, tickLabels], { opacity: 0, y: "-=10", duration: 0.25, ease: "power2.in" }, 7.35);
      tl.to("#fill", { opacity: 0, duration: 0.2 }, 7.4);
      tl.to("#knob", { opacity: 0, scale: 0.4, duration: 0.3, ease: "power3.in" }, 7.4);
      // timeline track rolls up into a lab sample dish
      tl.to(
        morph,
        {
          x: 140,
          y: 240,
          width: 380,
          height: 380,
          borderRadius: 190,
          backgroundColor: "#ffffff",
          boxShadow: "0 0 0 4px #4a6b8a, 0 18px 40px rgba(34,38,44,0.08)",
          duration: 0.55,
          ease: "power3.inOut",
        },
        7.4
      );
      tl.to("#step-2", { opacity: 0, y: -10, duration: 0.25 }, 7.4);
      tl.fromTo("#step-3", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 7.5);
            tl.fromTo(
        cells.map((c) => c.el),
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.015 },
        7.72
      );
      cells.forEach((c, i) => {
        tl.set(c.el, { rotation: c.rot }, 0);
        tl.to(c.el, { rotation: c.rot + (i % 2 ? 12 : -12), duration: 0.35, yoyo: true, repeat: 5, ease: "sine.inOut" }, 7.72);
      });
      tl.fromTo("#lab-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 7.6);
      tl.fromTo("#lab-num", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 7.65);
      // cells disappear one by one while the counter falls to 0
      const vanishOrder = [5, 0, 9, 3, 12, 7, 1, 10, 4, 13, 8, 2, 11, 6];
      const labCount = { v: 14 };
      vanishOrder.forEach((idx, k) => {
        tl.to(cells[idx].el, { opacity: 0, scale: 0.2, duration: 0.18, ease: "power2.in" }, 8.1 + k * 0.065);
      });
      tl.to(
        labCount,
        {
          v: 0,
          duration: 0.9,
          ease: "none",
          onUpdate: () => (document.getElementById("lab-num").textContent = Math.round(labCount.v)),
        },
        8.1
      );
      tl.to("#lab-num", { color: "#e0532a", duration: 0.2 }, 9.0);
      tl.fromTo("#lab-num", { scale: 1 }, { scale: 1.12, duration: 0.14, yoyo: true, repeat: 1, transformOrigin: "10% 70%" }, 9.0);
      tl.to(morph, { boxShadow: "0 0 0 4px #e0532a, 0 18px 40px rgba(34,38,44,0.08)", duration: 0.3 }, 9.0);
      // headline
      tl.set("#headline", { opacity: 1 }, 8.5);
      tl.fromTo(
        ["#hl-zero", "#hl-2", "#hl-3"],
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.08 },
        8.5
      );
      tl.fromTo("#hl-zero", { scale: 1 }, { scale: 1.1, duration: 0.14, yoyo: true, repeat: 1, transformOrigin: "50% 60%" }, 9.0);
      tl.fromTo("#hl-rule", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out" }, 8.9);
      tl.fromTo("#subline", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 9.05);

      // progress bar across the whole piece
      tl.fromTo("#progress-fill", { scaleX: 0 }, { scaleX: 1, duration: 7.1, ease: "none" }, 2.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
